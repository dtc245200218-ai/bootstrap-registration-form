<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký tài khoản</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />

    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: 30px 0;
      }

      .register-card {
        max-width: 650px;
        margin: auto;
        border: none;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      }

      .register-title {
        color: #0d6efd;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card register-card">
        <div class="card-body p-4 p-md-5">
          <h1 class="register-title text-center fw-bold mb-2">
            Đăng Ký Tài Khoản
          </h1>

          <p class="text-muted text-center mb-4">
            Vui lòng điền đầy đủ thông tin bên dưới
          </p>

          <form id="registerForm">
            <!-- Họ và tên -->
            <div class="mb-3">
              <label for="fullname" class="form-label"> Họ và tên </label>
              <input
                type="text"
                class="form-control"
                id="fullname"
                name="fullname"
                placeholder="Nhập họ và tên"
                required
              />
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label"> Email </label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                required
              />
            </div>

            <!-- Mật khẩu -->
            <div class="mb-3">
              <label for="password" class="form-label"> Mật khẩu </label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Nhập mật khẩu"
                minlength="8"
                required
              />
              <div class="form-text">Mật khẩu cần có ít nhất 8 ký tự.</div>
            </div>

            <!-- Xác nhận mật khẩu -->
            <div class="mb-3">
              <label for="confirmPassword" class="form-label">
                Xác nhận mật khẩu
              </label>
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Nhập lại mật khẩu"
                required
              />
              <div id="passwordMessage" class="form-text"></div>
            </div>

            <!-- Giới tính -->
            <fieldset class="mb-3">
              <legend class="form-label fs-6">Giới tính</legend>

              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="gender"
                  id="male"
                  value="Nam"
                  required
                />
                <label class="form-check-label" for="male"> Nam </label>
              </div>

              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="gender"
                  id="female"
                  value="Nữ"
                />
                <label class="form-check-label" for="female"> Nữ </label>
              </div>

              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="gender"
                  id="other"
                  value="Khác"
                />
                <label class="form-check-label" for="other"> Khác </label>
              </div>
            </fieldset>

            <!-- Sở thích -->
            <fieldset class="mb-3">
              <legend class="form-label fs-6">Sở thích</legend>

              <div class="row">
                <div class="col-6 col-md-4">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="hobbies"
                      value="Đọc sách"
                      id="reading"
                    />
                    <label class="form-check-label" for="reading"
                      >Đọc sách</label
                    >
                  </div>
                </div>

                <div class="col-6 col-md-4">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="hobbies"
                      value="Du lịch"
                      id="travel"
                    />
                    <label class="form-check-label" for="travel">Du lịch</label>
                  </div>
                </div>

                <div class="col-6 col-md-4">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="hobbies"
                      value="Thể thao"
                      id="sports"
                    />
                    <label class="form-check-label" for="sports"
                      >Thể thao</label
                    >
                  </div>
                </div>
              </div>
            </fieldset>

            <!-- Quốc gia -->
            <div class="mb-4">
              <label for="country" class="form-label"> Quốc gia </label>

              <select class="form-select" id="country" name="country" required>
                <option value="" selected disabled>Chọn quốc gia</option>
                <option value="Việt Nam">Việt Nam</option>
                <option value="Nhật Bản">Nhật Bản</option>
                <option value="Hàn Quốc">Hàn Quốc</option>
                <option value="Singapore">Singapore</option>
                <option value="Hoa Kỳ">Hoa Kỳ</option>
                <option value="Khác">Khác</option>
              </select>
            </div>

            <!-- Nút Submit -->
            <button type="submit" class="btn btn-primary w-100 py-2">
              Đăng Ký
            </button>

            <p class="text-muted text-center mt-3 mb-0 small">
              Bằng việc đăng ký, bạn đồng ý với các điều khoản sử dụng.
            </p>

            <div
              id="successMessage"
              class="alert alert-success mt-3 d-none"
              role="alert"
            ></div>
          </form>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("registerForm");
      const password = document.getElementById("password");
      const confirmPassword = document.getElementById("confirmPassword");
      const passwordMessage = document.getElementById("passwordMessage");
      const successMessage = document.getElementById("successMessage");

      function checkPassword() {
        if (confirmPassword.value === "") {
          passwordMessage.textContent = "";
          confirmPassword.setCustomValidity("");
          return;
        }

        if (password.value !== confirmPassword.value) {
          passwordMessage.textContent = "Mật khẩu xác nhận không khớp.";
          passwordMessage.className = "form-text text-danger";
          confirmPassword.setCustomValidity("Mật khẩu không khớp.");
        } else {
          passwordMessage.textContent = "Mật khẩu khớp.";
          passwordMessage.className = "form-text text-success";
          confirmPassword.setCustomValidity("");
        }
      }

      password.addEventListener("input", checkPassword);
      confirmPassword.addEventListener("input", checkPassword);

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        checkPassword();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        successMessage.textContent =
          "Đăng ký thành công! Đây là bản demo giao diện.";
        successMessage.classList.remove("d-none");
      });
    </script>
  </body>
</html>
